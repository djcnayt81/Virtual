name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files and configure
        run: |
          unzip -o *.zip
          
          # Auto-detect package name or applicationId
          PKG_NAME=$(grep -r "applicationId" app/build.gradle* | sed -E 's/.*applicationId[ ="]+([^"]+).*/\1/' | head -n 1)
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME=$(grep -r "namespace" app/build.gradle* | sed -E 's/.*namespace[ ="]+([^"]+).*/\1/' | head -n 1)
          fi
          if [ -z "$PKG_NAME" ]; then
            PKG_NAME="com.djcna.app"
          fi
          echo "Detected Package Name: $PKG_NAME"

          # Generate matching google-services.json
          mkdir -p app
          cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "app-build",
              "storage_bucket": "app-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef",
                  "android_client_info": {
                    "package_name": "$PKG_NAME"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "fake_api_key"}],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF

          # Generate debug.keystore
          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore || true
          cp debug.keystore ~/.android/debug.keystore || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          
